<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.cn/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #7C5CFF;
      --color-primary-container:    rgba(124, 92, 255, 0.2);
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面 === */
      --color-background:                 #070A14;
      --color-surface-container-lowest:   rgba(255, 255, 255, 0.03);
      --color-surface:                    rgba(255, 255, 255, 0.05);
      --color-surface-container:          rgba(255, 255, 255, 0.08);
      --color-surface-container-high:     rgba(255, 255, 255, 0.12);
      --color-surface-container-highest:  rgba(255, 255, 255, 0.16);
      /* === 文字 === */
      --color-on-surface:           #F7FAFF;
      --color-on-surface-variant:   #9AA7C7;
      /* === 功能色 === */
      --color-success:  #62FAD3;
      --color-error:    #FF6B8A;
      --color-warning:  #FFD166;
      /* === 边框 === */
      --color-outline:          rgba(255, 255, 255, 0.12);
      --color-outline-variant:  rgba(255, 255, 255, 0.08);
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.5rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-float:  0 10px 25px rgba(0, 0, 0, 0.4);
      --shadow-dialog: 0 25px 50px rgba(0, 0, 0, 0.5);
      /* === 字体 === */
      --font-sans: "Inter", system-ui, sans-serif;
    }

    /* 毛玻璃效果 */
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-hover:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
    }

    /* 渐变背景动画 */
    @keyframes gradientDrift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .bg-gradient-animate {
      background: linear-gradient(-45deg, #070A14, #1A1F3A, #0F172A, #070A14);
      background-size: 400% 400%;
      animation: gradientDrift 20s ease infinite;
    }

    /* 发光效果 */
    .glow-primary {
      box-shadow: 0 0 20px rgba(124, 92, 255, 0.3);
    }

    .glow-cyan {
      box-shadow: 0 0 20px rgba(105, 231, 255, 0.3);
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-gradient-animate text-on-surface font-sans min-h-screen">

  <!-- @nav:start 导航组件，不需要的页面则不要复制此段（从 @nav:start 到 @nav:end） -->
  <header class="glass sticky top-0 z-40 h-16 flex items-center justify-between px-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-cyan-400 flex items-center justify-center glow-primary">
        <i data-lucide="book-open" class="text-white w-5 h-5"></i>
      </div>
      <span class="font-bold text-xl bg-gradient-to-r from-primary to-cyan-400 bg-clip-text text-transparent">小说工坊</span>
    </div>
  </header>

  <div class="flex" style="height: calc(100vh - 4rem)">
    <aside class="w-64 shrink-0 glass overflow-y-auto p-4">
      <div class="space-y-1">
        <a href="home.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary/20 text-primary font-medium text-sm glass-hover transition-all"
           aria-current="page">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          仪表板
        </a>
        <a href="chapters.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm glass-hover transition-all">
          <i data-lucide="file-text" class="w-4 h-4"></i>
          章节管理
        </a>
        <a href="characters.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm glass-hover transition-all">
          <i data-lucide="users" class="w-4 h-4"></i>
          角色设定
        </a>
        <a href="scenes.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm glass-hover transition-all">
          <i data-lucide="map" class="w-4 h-4"></i>
          场景设定
        </a>
        <a href="editor.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm glass-hover transition-all">
          <i data-lucide="edit" class="w-4 h-4"></i>
          小说编辑
        </a>
      </div>

      <div class="mt-8 pt-6 border-t border-outline-variant/20">
        <button class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-gradient-to-r from-primary to-cyan-500 text-white font-medium text-sm hover:opacity-90 transition-opacity glow-primary">
          <i data-lucide="download" class="w-4 h-4"></i>
          导出小说
        </button>
      </div>
    </aside>
    <!-- @nav:end 导航组件，不需要的页面则不要复制此段 -->

    <!--
      ⚠️ <main> 的 class 由主 Agent 根据步骤 4.5 的布局决策与实际设计需要填写，约束如下：
        - 有侧边栏布局：必须用 flex-1（可加 min-w-0 / overflow-y-auto 等），禁止使用 max-w
        - 无侧边栏布局：必须用 max-w-4xl ~ max-w-7xl 之一 + mx-auto
        - 其他样式按实际设计需要自由组合
      如无特殊需求，禁止使用  小于 max-w-4xl 的设置（过窄，桌面端会大量留白）。
    -->
    <!-- @main-content:start -->
    <main class="flex-1 min-w-0 overflow-y-auto p-8">
      <!-- 页面内容 -->
    </main>
    <!-- @main-content:end -->
  </div>

  <script>lucide.createIcons();</script>
</body>

</html>
