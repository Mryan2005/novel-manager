  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #7C5CFF;
      --color-primary-container:    rgba(124, 92, 255, 0.2);
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面 === */
      --color-background:                 #070A14;
      --color-surface-container-lowest:   rgba(255, 255, 255, 0.03);
      --color-surface:                    rgba(255, 255, 255, 0.05);
      --color-surface-container:          rgba(255, 255, 255, 0.08);
      --color-surface-container-high:     rgba(255, 255, 255, 0.12);
      --color-surface-container-highest:  rgba(255, 255, 255, 0.16);
      /* === 文字 === */
      --color-on-surface:           #F7FAFF;
      --color-on-surface-variant:   #9AA7C7;
      /* === 功能色 === */
      --color-success:  #62FAD3;
      --color-error:    #FF6B8A;
      --color-warning:  #FFD166;
      /* === 边框 === */
      --color-outline:          rgba(255, 255, 255, 0.12);
      --color-outline-variant:  rgba(255, 255, 255, 0.08);
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.5rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-float:  0 10px 25px rgba(0, 0, 0, 0.4);
      --shadow-dialog: 0 25px 50px rgba(0, 0, 0, 0.5);
      /* === 字体 === */
      --font-sans: "Inter", system-ui, sans-serif;
    }

    /* 毛玻璃效果 */
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-hover:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
    }

    /* 渐变背景动画 */
    @keyframes gradientDrift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .bg-gradient-animate {
      background: linear-gradient(-45deg, #070A14, #1A1F3A, #0F172A, #070A14);
      background-size: 400% 400%;
      animation: gradientDrift 20s ease infinite;
    }

    /* 发光效果 */
    .glow-primary {
      box-shadow: 0 0 20px rgba(124, 92, 255, 0.3);
    }

    .glow-cyan {
      box-shadow: 0 0 20px rgba(105, 231, 255, 0.3);
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

  <script>
    $(function() {
      // 新建章节按钮 - 点击后打开新建章节模态框
      $('#btn-new-chapter').on('click', function() {
        $('#modal-title').text('新建章节');
        $('#input-chapter-title').val('');
        $('#input-chapter-status').val('未开始');
        $('#chapter-modal').removeClass('hidden');
      });

      // 编辑章节按钮 - 点击后打开编辑章节模态框，填充当前章节信息
      $('#chapter-list').on('click', '.btn-edit-chapter', function() {
        const chapterId = $(this).data('id');
        const chapterItem = $(this).closest('.chapter-item');
        const chapterTitle = chapterItem.find('h3').text();
        const chapterStatus = chapterItem.find('span.inline-flex').text();
        
        $('#modal-title').text('编辑章节');
        $('#input-chapter-title').val(chapterTitle);
        $('#input-chapter-status').val(chapterStatus);
        $('#chapter-modal').data('edit-id', chapterId);
        $('#chapter-modal').removeClass('hidden');
      });

      // 关闭模态框按钮
      $('#btn-close-modal, #btn-cancel').on('click', function() {
        $('#chapter-modal').addClass('hidden');
      });

      // 保存章节表单 - 模拟保存操作
      $('#chapter-form').on('submit', function(e) {
        e.preventDefault();
        const title = $('#input-chapter-title').val();
        const status = $('#input-chapter-status').val();
        const editId = $('#chapter-modal').data('edit-id');
        
        if (editId) {
          // 编辑模式：更新对应章节
          const chapterItem = $(`.chapter-item[data-id="${editId}"]`);
          chapterItem.find('h3').text(title);
          // 更新状态标签
          const statusBadge = chapterItem.find('span.inline-flex');
          statusBadge.text(status);
          statusBadge.removeClass('bg-success/15 text-success bg-warning/15 text-warning bg-on-surface-variant/15 text-on-surface-variant');
          if (status === '已完成') {
            statusBadge.addClass('bg-success/15 text-success');
          } else if (status === '撰写中') {
            statusBadge.addClass('bg-warning/15 text-warning');
          } else {
            statusBadge.addClass('bg-on-surface-variant/15 text-on-surface-variant');
          }
        } else {
          // 新建模式：添加新章节到列表
          const newChapterId = Date.now();
          const statusClass = status === '已完成' ? 'bg-success/15 text-success' : 
                              status === '撰写中' ? 'bg-warning/15 text-warning' : 
                              'bg-on-surface-variant/15 text-on-surface-variant';
          const newChapterHtml = `
            <div class="grid grid-cols-12 gap-4 px-6 py-4 hover:bg-surface-container/50 transition-colors items-center chapter-item" data-id="${newChapterId}">
              <div class="col-span-1 flex items-center gap-2">
                <i data-lucide="grip-vertical" class="w-4 h-4 text-on-surface-variant cursor-move"></i>
                <span class="text-sm font-medium text-on-surface-variant">${$('#chapter-list .chapter-item').length + 1}</span>
              </div>
              <div class="col-span-4">
                <h3 class="text-sm font-semibold text-on-surface">${title}</h3>
                <span class="inline-flex items-center px-2 py-0.5 rounded-sm text-xs font-medium ${statusClass} mt-1">${status}</span>
              </div>
              <div class="col-span-2">
                <span class="text-sm text-on-surface">0</span>
              </div>
              <div class="col-span-2">
                <span class="text-sm text-on-surface-variant">${new Date().toISOString().split('T')[0]}</span>
              </div>
              <div class="col-span-2">
                <span class="text-sm text-on-surface-variant">-</span>
              </div>
              <div class="col-span-1 flex items-center gap-2">
                <button class="btn-edit-chapter text-primary text-sm font-medium hover:underline" data-id="${newChapterId}">
                  <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>
                <button class="btn-delete-chapter text-error text-sm font-medium hover:underline" data-id="${newChapterId}">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          `;
          $('#chapter-list').append(newChapterHtml);
          lucide.createIcons();
        }
        
        $('#chapter-modal').addClass('hidden');
      });

      // 删除章节按钮 - 点击后删除对应章节
      $('#chapter-list').on('click', '.btn-delete-chapter', function() {
        const chapterId = $(this).data('id');
        if (confirm('确定要删除该章节吗？')) {
          $(this).closest('.chapter-item').remove();
          // 重新排序号
          $('#chapter-list .chapter-item').each(function(index) {
            $(this).find('.text-on-surface-variant.font-medium').text(index + 1);
          });
        }
      });

      // 排序功能 - 拖拽排序入口，完整实现需要引入拖拽库
